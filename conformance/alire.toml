name = "messages_conformance"
description = "ICU message-rendering conformance checks for the messages crate"
version = "0.1.0"
authors = ["Bent Bracke"]
maintainers = ["Bent Bracke <bent@bracke.dk>"]
maintainers-logins = ["bracke"]
licenses = "MIT"
website = "https://github.com/bracke/messages"
tags = ["messages", "conformance", "icu", "checks"]
project-files = ["conformance.gpr"]

executables = ["check_conformance"]

[[depends-on]]
gnat_native = "=15.2.1"

[[depends-on]]
messages = "*"

[[depends-on]]
project_tools = "*"

[[pins]]
messages = { path = ".." }
project_tools = { path = "../../project_tools" }

# Build dependencies in the development profile (-Og) too, not the default
# release (-O3), so this root and the parent share object files rather than
# forcing each other into full rebuilds.
[build-profiles]
"*" = "development"
